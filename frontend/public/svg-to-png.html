<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG to PNG Converter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .preview-item {
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    canvas {
      border: 1px solid #eee;
      margin-bottom: 10px;
    }
    button {
      background-color: #059669;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #047857;
    }
  </style>
</head>
<body>
  <h1>TsunaAgri ロゴPNG生成ツール</h1>
  <div class="container">
    <div class="preview">
      <div class="preview-item">
        <h3>128x128px</h3>
        <canvas id="canvas128" width="128" height="128"></canvas>
        <button onclick="downloadPNG(128)">PNGをダウンロード</button>
      </div>
      <div class="preview-item">
        <h3>256x256px</h3>
        <canvas id="canvas256" width="256" height="256"></canvas>
        <button onclick="downloadPNG(256)">PNGをダウンロード</button>
      </div>
      <div class="preview-item">
        <h3>512x512px</h3>
        <canvas id="canvas512" width="512" height="512"></canvas>
        <button onclick="downloadPNG(512)">PNGをダウンロード</button>
      </div>
    </div>
  </div>

  <script>
    const loadSVG = (url, size, callback) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0);
        callback();
      };
      img.src = url;
    };

    const downloadPNG = (size) => {
      const canvas = document.getElementById(`canvas${size}`);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `tsunaagri-logo-${size}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    // 画像の読み込み
    window.onload = () => {
      loadSVG('/images/tsunaagri-logo-128.svg', 128, () => console.log('128px loaded'));
      loadSVG('/images/tsunaagri-logo-256.svg', 256, () => console.log('256px loaded'));
      loadSVG('/images/tsunaagri-logo-512.svg', 512, () => console.log('512px loaded'));
    };
  </script>
</body>
</html>
